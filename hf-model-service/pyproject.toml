[project]
name = "hf-model-service"
version = "0.1.0"
description = "HuggingFace model service"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.0.0",
    "diffusers>=0.37.0",
    "huggingface_hub>=1.0.0",
    "optimum-quanto>=0.2.0",
    "pillow>=12.0.0",
    "python-dotenv>=1.0.0",
    "safetensors>=0.7.0",
    "torch>=2.0.0",
    "transformers>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "ipython>=8.0.0",
    "pytest>=7.0.0",
]

[tool.uv]
managed = true
